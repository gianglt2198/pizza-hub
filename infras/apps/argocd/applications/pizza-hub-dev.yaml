apiVersion: argoproj.io/v1alpha1  
kind: Application  
metadata:  
  name: pizza-hub-dev  
  namespace: argocd  
  labels:  
    environment: dev  
spec:  
  project: default  

  source: 
    repoURL: 'https://github.com/pizza-hub/pizza-hub.git'
    targetRevision: HEAD
    path: infras/apps/pizza-hub/overlays/dev

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: pizza-hub

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: "5s"
        factor: 2
        maxDuration: "1m"