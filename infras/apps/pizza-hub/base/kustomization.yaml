apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: pizza-hub-base

resources:
- namespace.yaml  
- secret.yaml  
- configmap.yaml  
- postgres/pvc.yaml  
- postgres/init-configmap.yaml  
- postgres/deployment.yaml  
- postgres/service.yaml  
- redis/deployment.yaml  
- redis/service.yaml  
- app/deployment.yaml  
- app/service.yaml  
- app/hpa.yaml  

commonLabels:
  app.kubernetes.io/name: pizza-hub
  app.kubernetes.io/part-of: pizza-hub

images:
- name: pizza-app
  newName: gianglt1/pizza-hub-app
  newTag: v1.0.0