apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: pizza-hub

patchesStrategicMerge:
  - patches/app-replicas.yaml
  - patches/resources-limits.yaml

configMapGenerator:
  - name: pizza-config
    behavior: merge
    literals:
      - ENV=dev  
      - DB_HOST=postgres-svc  # Use in-cluster PostgreSQL  
      - REDIS_HOST=redis-svc  # Use in-cluster Redis  

images:  
- name: pizza-app  
  newName: gianglt1/pizza-hub-app
  newTag: dev-latest  