apiVersion: apps/v1
kind: Deployment
metadata:
  name: pizza-app
  labels:
    app: pizza-app
spec:
  template:
    spec:
      containers:
      - name: pizza-app
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi" 
            cpu: "100m"
