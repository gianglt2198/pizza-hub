apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-sql
  namespace: pizza-hub
data:
  init.sql: | 
    CREATE TABLE IF NOT EXISTS pizzas (
        id          SERIAL PRIMARY KEY,
        name        VARCHAR(100) NOT NULL,
        description TEXT,
        price       NUMERIC(10,2) NOT NULL,
        category    VARCHAR(50) NOT NULL DEFAULT 'classic',
        available   BOOLEAN NOT NULL DEFAULT true,
        created_at  TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    
    CREATE TABLE IF NOT EXISTS orders (
        id            SERIAL PRIMARY KEY,
        customer_name VARCHAR(100) NOT NULL,
        status        VARCHAR(20) NOT NULL DEFAULT 'pending',
        total_price   NUMERIC(10,2) NOT NULL,
        created_at    TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at    TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );
    
    CREATE TABLE IF NOT EXISTS order_items (
        id         SERIAL PRIMARY KEY,
        order_id   INT NOT NULL REFERENCES orders(id) ON DELETE CASCADE,
        pizza_id   INT NOT NULL REFERENCES pizzas(id),
        quantity   INT NOT NULL DEFAULT 1,
        price      NUMERIC(10,2) NOT NULL
    );
    
    -- Seed data
    INSERT INTO pizzas (name, description, price, category) VALUES
        ('Margherita',     'Tomato sauce, mozzarella, fresh basil',          8.99,  'classic'),
        ('Pepperoni',      'Tomato sauce, mozzarella, pepperoni',            10.99, 'classic'),
        ('BBQ Chicken',    'BBQ sauce, grilled chicken, red onion, cilantro',12.99, 'premium'),
        ('Truffle Shroom', 'Truffle oil, mushrooms, parmesan, arugula',      14.99, 'premium'),
        ('Garden Veggie',  'Tomato sauce, bell peppers, olives, mushrooms',   9.99, 'veggie'),
        ('Vegan Delight',  'Cashew cheese, roasted veggies, pesto',          11.99, 'veggie') ON CONFLICT DO NOTHING;
