apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: pizza-hub
spec:
  replicas: 0
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pizza-secrets
                  key: db-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pizza-secrets
                  key: db-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: pizza-secrets
                  key: db-name
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            exec: 
              command: ["pg_isready", "-U", "pizza", "-d", "pizzahub"]
            initialDelaySeconds: 5 
            periodSeconds: 5
      volumes:
        - name: postgres-storage 
          persistentVolumeClaim: 
            claimName: postgres-pvc 
        - name: init-sql 
          configMap: 
            name: postgres-init-sql