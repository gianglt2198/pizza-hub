apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: redis 
  namespace: pizza-hub 
spec: 
  replicas: 0
  selector: 
    matchLabels: 
      app: redis 
  template: 
    metadata: 
      labels: 
        app: redis 
    spec: 
      containers: 
        - name: redis 
          image: redis:7-alpine 
          command: ["redis-server", "--appendonly", "yes"] 
          ports: 
          - containerPort: 6379 
          resources: 
            requests: 
              memory: "64Mi" 
              cpu: "50m" 
            limits: 
              memory: "128Mi" 
              cpu: "100m" 
          readinessProbe: 
            exec: 
              command: ["redis-cli", "ping"] 
            initialDelaySeconds: 3 
            periodSeconds: 5

