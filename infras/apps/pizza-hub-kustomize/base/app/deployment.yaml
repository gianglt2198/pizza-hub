apiVersion: apps/v1
kind: Deployment
metadata:
  name: pizza-app
  namespace: pizza-hub
  labels:
    app: pizza-app
spec:
  replicas: 0
  selector:
    matchLabels:
      app: pizza-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
  template:
    metadata: 
      labels:
        app: pizza-app
    spec:
      containers:
        - name: pizza-app
          image: gianglt1/pizza-hub-app:v1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: pizza-config
          env:
            - name: DATABASE__USER
              valueFrom:
                secretKeyRef:
                  name: pizza-secrets
                  key: db-user
            - name: DATABASE__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pizza-secrets
                  key: db-password
            - name: DATABASE__NAME
              valueFrom:
                secretKeyRef:
                  name: pizza-secrets
                  key: db-name
          volumeMounts:
            - name: app-config
              mountPath: /app/config
              readOnly: true
          resources: 
            requests: 
              memory: "64Mi" 
              cpu: "50m" 
            limits: 
              memory: "128Mi" 
              cpu: "200m" 
          # Liveness: K8s restart pod nếu app bị deadlock/crash 
          livenessProbe: 
            httpGet: 
              path: /health 
              port: 8080 
            initialDelaySeconds: 10 
            periodSeconds: 15 
            failureThreshold: 3 
          # Readiness: K8s chỉ gửi traffic khi app thực sự sẵn sàng 
          readinessProbe: 
            httpGet: 
              path: /health 
              port: 8080 
            initialDelaySeconds: 5 
            periodSeconds: 10
      volumes:
        - name: app-config
          configMap:
            name: pizza-app-config-file