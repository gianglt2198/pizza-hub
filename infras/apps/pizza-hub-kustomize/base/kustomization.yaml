apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: pizza-hub-base

resources:
- namespace.yaml
- secret.yaml
- postgres/pvc.yaml
- postgres/init-configmap.yaml
- postgres/deployment.yaml
- postgres/service.yaml
- redis/deployment.yaml
- redis/service.yaml
- app/deployment.yaml
- app/service.yaml
- app/hpa.yaml

configMapGenerator:
  - name: pizza-config
    literals:
      - APP__SERVER_PORT=8080
      - ENV=production
      - DATABASE__HOST=postgres-svc
      - DATABASE__PORT=5432
      - DATABASE__SSL_MODE=disable
      - REDIS__HOST=redis-svc
      - REDIS__PORT=6379

images:
- name: pizza-app
  newName: gianglt1/pizza-hub-app
  newTag: v1.0.0
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/name: pizza-hub
    app.kubernetes.io/part-of: pizza-hub
