apiVersion: v1
kind: Service
metadata:
  name: {{ include "pizza-hub.fullname" . }}-svc
  labels:
    {{- include "pizza-hub.labels" . | nindent 4 }}
spec:
  type: {{ .Values.app.service.type }}
  ports:
    - port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.app.service.type "NodePort") .Values.app.service.nodePort }}
      nodePort: {{ .Values.app.service.nodePort }}
      {{- end }}
  selector:
    {{- include "pizza-hub.selectorLabels" . | nindent 4 }}
