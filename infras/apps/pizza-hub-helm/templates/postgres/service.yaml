{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pizza-hub.postgresql.name" . }}-svc
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pizza-hub.postgresql.labels" . | nindent 4 }}
spec:
  type: {{ .Values.postgresql.service.type }}
  ports:
    - port: {{ .Values.postgresql.service.port }}
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "pizza-hub.postgresql.selectorLabels" . | nindent 4 }}
{{- end }}
