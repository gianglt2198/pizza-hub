services:
  postgres:
    image: postgres:16-alpine
    container_name: pizza-postgres
    environment:
      POSTGRES_USER: pizza
      POSTGRES_PASSWORD: pizza123
      POSTGRES_DB: pizzahub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizza -d pizzahub"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pizza-net

  redis:
    image: redis:7-alpine
    container_name: pizza-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pizza-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pizza-app
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: pizza
      DB_PASSWORD: pizza123
      DB_NAME: pizzahub
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pizza-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  pizza-net:
    driver: bridge
