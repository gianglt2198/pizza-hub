services:
  postgres:
    image: postgres:16-alpine
    container_name: pizza-postgres
    environment:
      POSTGRES_USER: pizza
      POSTGRES_PASSWORD: pizza123
      POSTGRES_DB: pizzahub
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizza -d pizzahub"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pizza-net

  redis:
    image: redis:7-alpine
    container_name: pizza-redis
    command: redis-server --appendonly yes
    ports:
      - "6377:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pizza-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pizza-app
    working_dir: /app
    ports:
      - "8083:8080"
    env_file:
      - ".env"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pizza-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  pizza-net:
    driver: bridge
