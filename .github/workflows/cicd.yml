      #       git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
      
      - name: Configure Git for committing changes
        run: |
          echo "Configuring Git..."
          echo ${{ github.repository }}
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://gianglt2198:${{ secrets.PAT }}@github.com/${{ github.repository }}

      - name: Commit and push changes  
        run: |  
          git add infras/apps/pizza-hub-kustomize/overlays/dev/kustomization.yaml  
          git commit -m "Update dev image to ${{ github.sha }}" || exit 0  
